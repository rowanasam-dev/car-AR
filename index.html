<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try the Car in Your Space</title>
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body style="margin:0; font-family:sans-serif; text-align:center;">
  <h2>Try the Car in Your Space</h2>

  <model-viewer
    src="cyberpunk_car.glb"
    ar
    ar-modes="scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    alt="3D model of a car"
    style="width:100%; height:70vh;">
  </model-viewer>

  <p>Tap the AR icon and place the car in front of you</p>
</body>
</html>
